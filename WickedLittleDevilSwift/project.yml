name: WickedLittleDevilSwift
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.wickedlittlewebsites.wickeddevil.swift
    PRODUCT_NAME: WickedLittleDevilSwift
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Wicked Little Devil
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
    ARCHS: arm64
    SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - '@executable_path/Frameworks'
packages:
  WickedDevilCore:
    path: ../WickedDevilCore
targets:
  WickedLittleDevilSwift:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    dependencies:
      - package: WickedDevilCore
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/MenuAssets.xcassets
      - path: Resources/Fonts
        type: folder
      - path: Resources/Levels
        type: folder
      - path: Resources/Art
        type: folder
      - path: Resources/Audio
        type: folder
      - path: Resources/Particles
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wickedlittlewebsites.wickeddevil.swift
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
schemes:
  WickedLittleDevilSwift:
    build:
      targets:
        WickedLittleDevilSwift: all
    run:
      config: Debug
    archive:
      config: Release
